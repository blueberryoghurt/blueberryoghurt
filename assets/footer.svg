<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140">
  <style>
    .hv{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
    .mono{font-family:Consolas,'JetBrains Mono','Courier New',monospace}
    .off{animation:off 7s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes off{0%,72%{transform:scale(1,1);opacity:1;filter:brightness(1)}80%{transform:scale(1,.02);opacity:1;filter:brightness(3)}86%{transform:scale(0,.02);opacity:1}87%,95%{transform:scale(0,0);opacity:0}100%{transform:scale(1,1);opacity:1}}
    .dot{animation:dot 7s infinite}
    @keyframes dot{0%,85%{opacity:0}87%{opacity:1}94%{opacity:0}100%{opacity:0}}
    .blink{animation:blink 1s infinite steps(1,end)}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <clipPath id="card"><rect width="1000" height="140" rx="18"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".35"/></pattern>
    <radialGradient id="scr" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#22302e"/><stop offset="1" stop-color="#0b1010"/></radialGradient>
    <radialGradient id="pt" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#D4FF00" stop-opacity=".7"/><stop offset="1" stop-color="#D4FF00" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="140" fill="#050505"/>
    <g class="off">
      <rect x="0" y="0" width="1000" height="140" fill="url(#scr)"/>
      <text x="500" y="66" text-anchor="middle" class="hv" font-size="30" fill="#f2f2f2" letter-spacing="2">SIGNAL LOST<tspan fill="#D4FF00" class="blink">_</tspan></text>
      <text x="500" y="96" text-anchor="middle" class="mono" font-size="14" fill="#9fd8c8" letter-spacing="3">THANKS FOR VISITING, PROXY · SEE YOU IN THE HOLLOW</text>
      <text x="40" y="30" class="mono" font-size="11" fill="#D4FF00" font-weight="bold">CH-00</text>
      <text x="960" y="30" text-anchor="end" class="mono" font-size="11" fill="#666">BLUYO · HDD</text>
      <rect width="1000" height="140" fill="url(#scanlines)"/>
    </g>
    <circle cx="500" cy="70" r="14" fill="url(#pt)" class="dot"/>
  </g>
  <rect x="1" y="1" width="998" height="138" rx="18" fill="none" stroke="#262628" stroke-width="2"/>
</svg>
